<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <title>销售话术卡 V6.1 最新话术版</title>
  <style>
    :root{--bg:#edf3ef;--surface:#fff;--surface-2:#f6faf7;--ink:#18241f;--muted:#66736d;--line:#d3ded8;--main:#17684f;--main-soft:#e4f0e9;--active:#d4e9dd;--flash:#fff3b5}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;touch-action:manipulation}
    .app{width:min(100%,1500px);min-height:100dvh;margin:auto;padding:8px;display:grid;grid-template-rows:auto auto auto 1fr;gap:7px}.brand{margin:0;font-size:16px;line-height:1.15;font-weight:850}
    .opening,.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}.opening{padding:6px}.section-label,.panel-title{margin:0 0 5px;color:var(--main);font-size:14px;line-height:1.2;font-weight:850}.panel-title{padding:7px 8px 2px}
    .opening-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.main-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.main-tab{min-height:38px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:5px 8px;font-weight:850;cursor:pointer}.main-tab.active{border-color:#88ad9b;background:var(--active);color:var(--main)}
    .workspace{min-width:0}.panel{display:none}.panel.active{display:block}.panel-body{padding:0 7px 7px}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;align-items:start}.group-card{min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px}.group-title{margin:0 0 5px;padding:0 2px;color:var(--main);font-size:14px;line-height:1.2;font-weight:850}
    .index-list{display:grid;gap:4px}.script-row{display:grid;grid-template-columns:minmax(0,1fr) 62px;align-items:center;gap:7px;min-width:0;min-height:38px;padding:3px 4px;background:#fff;border-radius:6px}.script-name{min-width:0;border:0;background:transparent;color:var(--ink);padding:4px;text-align:left;font-weight:700;line-height:1.25;cursor:pointer;overflow-wrap:anywhere}.script-name:hover{color:var(--main)}.copy{width:62px;min-width:62px;min-height:31px;border:0;border-radius:6px;background:var(--main);color:#fff;padding:3px 4px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.script-row.flash{background:var(--flash)}
    .drawer-layer{position:fixed;inset:0;z-index:50;display:none;background:rgba(11,28,21,.32)}.drawer-layer.open{display:block}.drawer{position:absolute;top:0;right:0;width:min(440px,92vw);height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#fff;box-shadow:-8px 0 28px rgba(12,35,27,.18);padding:14px}.drawer-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px}.drawer-title{flex:1;margin:0;font-size:16px}.close{min-width:34px;min-height:30px;border:0;border-radius:6px;background:var(--main-soft);color:var(--main);font-size:18px;cursor:pointer}.drawer-text{overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding:13px 1px;font-size:15px;line-height:1.65}.drawer-copy{min-height:40px;border:0;border-radius:7px;background:var(--main);color:#fff;font-weight:850;cursor:pointer}
    @media(max-width:760px){body{font-size:13px}.app{padding:5px;gap:5px}.brand{font-size:15px}.opening{padding:5px}.opening-grid{grid-template-columns:1fr;gap:3px}.main-tabs{gap:5px}.main-tab{min-height:36px}.panel-title{padding:6px 5px 2px}.panel-body{padding:0 4px 5px}.section-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.group-card{padding:5px}.group-title{margin-bottom:3px;font-size:13px;overflow-wrap:anywhere}.index-list{gap:3px}.script-row{grid-template-columns:minmax(0,1fr) 50px;gap:4px;min-height:35px;padding:2px}.script-name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;padding:2px;font-size:12px;line-height:1.2}.copy{width:50px;min-width:50px;min-height:34px;padding:2px;font-size:12px}.drawer{top:auto;bottom:0;width:100%;height:min(72dvh,620px);border-radius:14px 14px 0 0;padding:12px}.drawer-title{font-size:15px}.drawer-text{font-size:14.5px}}
  </style>
</head>
<body>
  <main class="app">
    <h1 class="brand">销售话术卡</h1>
    <section class="opening"><h2 class="section-label">① 新客进线</h2><div class="opening-grid" id="opening"></div></section>
    <nav class="main-tabs" aria-label="话术区域切换"><button class="main-tab active" data-pane="customers" type="button" aria-selected="true">客户分类</button><button class="main-tab" data-pane="qa" type="button" aria-selected="false">高频Q&amp;A</button></nav>
    <div class="workspace">

    </div>
  </main>
  <div class="drawer-layer" id="drawer-layer" aria-hidden="true"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-head"><h2 class="drawer-title" id="drawer-title"></h2><button class="close" id="drawer-close" type="button" aria-label="关闭">×</button></header><div class="drawer-text" id="drawer-text"></div><button class="drawer-copy" id="drawer-copy" type="button">复制完整话术</button></aside></div>

        "lines": [
          "我们家炒菌子炒了七年了，做的都是老顾客回头的生意，货真价实、薄利多销。菌子都是我哥蹲在楚雄一个山头一个山头去收的，山里出什么、我们就卖什么，品质不好、不应季的菌子我们都不收，不泡药水不掺假，您只要尝一次就知道了，嘴巴不会骗人的",

    const byId=id=>document.getElementById(id);let currentText='';
    async function copyText(text,button,row){let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch(error){const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();copied=document.execCommand('copy');area.remove()}if(copied){const original=button.textContent;button.textContent='已复制✓';if(row)row.classList.add('flash');setTimeout(()=>{button.textContent=original;if(row)row.classList.remove('flash')},1000)}}
    function openDrawer(name,text){currentText=text;byId('drawer-title').textContent=name;byId('drawer-text').textContent=text;byId('drawer-layer').classList.add('open');byId('drawer-layer').setAttribute('aria-hidden','false')}
    function closeDrawer(){byId('drawer-layer').classList.remove('open');byId('drawer-layer').setAttribute('aria-hidden','true')}
    function scriptRow(name,text){const row=document.createElement('div');row.className='script-row';const title=document.createElement('button');title.type='button';title.className='script-name';title.textContent=name;title.addEventListener('click',()=>openDrawer(name,text));const copy=document.createElement('button');copy.type='button';copy.className='copy';copy.textContent='复制';copy.addEventListener('click',()=>copyText(text,copy,row));row.append(title,copy);return row}
    function renderList(target,names,lines){target.replaceChildren(...lines.map((line,index)=>scriptRow(names[index],line)))}
    function renderGroups(target,groups,labelMap){target.replaceChildren(...groups.map(group=>{const section=document.createElement('section');section.className='group-card';const title=document.createElement('h3');title.className='group-title';title.textContent=group.title.replace(/^[A-D]\.\s*/, '');const list=document.createElement('div');list.className='index-list';renderList(list,labelMap[group.title],group.lines);section.append(title,list);return section}))}
    data.content.opening.forEach((line,index)=>byId('opening').append(scriptRow(data.labels.opening[index],line)));
    renderGroups(byId('customer-grid'),data.content.customers,data.labels.customers);renderGroups(byId('qa-grid'),data.content.qa,data.labels.qa);
    document.querySelectorAll('.main-tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.main-tab').forEach(tab=>{const selected=tab===button;tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected))});byId('customers-panel').classList.toggle('active',button.dataset.pane==='customers');byId('qa-panel').classList.toggle('active',button.dataset.pane==='qa')}));
    byId('drawer-close').addEventListener('click',closeDrawer);byId('drawer-layer').addEventListener('click',event=>{if(event.target===byId('drawer-layer'))closeDrawer()});byId('drawer-copy').addEventListener('click',()=>copyText(currentText,byId('drawer-copy')));document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
  </script>
</body>
</html>
