<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <title>销售话术卡 V5.6</title>
  <style>
    :root{--bg:#eef3f0;--surface:#fff;--surface-2:#f7faf8;--ink:#17231e;--muted:#69756f;--line:#d5dfda;--main:#17684f;--main-soft:#e4f0e9;--active:#d5e9de;--flash:#fff3b5}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;touch-action:manipulation}
    .app{height:100dvh;max-width:1440px;margin:auto;padding:7px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:6px}.brand{margin:0;font-size:15px;line-height:1.1;font-weight:850}
    .opening,.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}.opening{padding:5px}.section-label,.panel-title{margin:0 0 4px;font-size:14px;line-height:1.15;font-weight:850;color:var(--main)}.panel-title{padding:7px 7px 2px}
    .opening-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.index-list{display:grid;gap:4px}.index-item{display:flex;align-items:center;gap:5px;min-width:0;background:var(--surface-2);border-radius:6px;padding:4px}.index-name{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:4px 5px;text-align:left;font-weight:700;cursor:pointer;overflow-wrap:anywhere}.index-name:hover{color:var(--main)}.copy{flex:0 0 auto;border:0;border-radius:6px;background:var(--main);color:#fff;min-width:43px;min-height:27px;padding:3px 7px;font-size:12px;font-weight:800;cursor:pointer}.index-item.flash{background:var(--flash)}
    .main-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.main-tab{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);min-height:36px;padding:5px 8px;font-weight:800;cursor:pointer}.main-tab.active{border-color:#8db09f;background:var(--active);color:var(--main)}.workspace{min-height:0}.panel{display:none;height:100%;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.panel.active{display:grid}.panel-body{min-height:0;overflow:auto;padding:0 6px 6px;scrollbar-gutter:stable}.customer-groups{display:grid;gap:7px}.customer-group,.qa-group{min-width:0;max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px}.customer-group-title,.qa-group-title{margin:0 0 4px;padding:0 2px;color:var(--main);font-size:13px;line-height:1.15;font-weight:850}.customer-group .index-list,.qa-group .index-list{gap:3px}.customer-group .index-item,.qa-group .index-item{display:grid;grid-template-columns:minmax(0,1fr) 64px;align-items:center;column-gap:7px;min-height:36px;background:#fff;padding:3px 4px}.customer-group .index-name,.qa-group .index-name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;padding:2px 3px;font-size:12.5px;line-height:1.25}.customer-group .copy,.qa-group .copy{width:64px;min-width:64px;min-height:30px;padding:3px 5px;font-size:11.5px;justify-self:end}.qa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
    .drawer-layer{position:fixed;inset:0;z-index:50;display:none;background:rgba(11,28,21,.32)}.drawer-layer.open{display:block}.drawer{position:absolute;top:0;right:0;width:min(430px,92vw);height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#fff;box-shadow:-8px 0 28px rgba(12,35,27,.18);padding:14px}.drawer-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px}.drawer-title{flex:1;margin:0;font-size:16px}.close{border:0;background:var(--main-soft);color:var(--main);border-radius:6px;min-width:34px;min-height:30px;font-size:18px;cursor:pointer}.drawer-text{overflow:auto;white-space:pre-line;overflow-wrap:anywhere;font-size:15px;line-height:1.65;padding:13px 1px}.drawer-copy{border:0;border-radius:7px;background:var(--main);color:#fff;min-height:40px;font-weight:850;cursor:pointer}
    @media(max-width:760px){body{font-size:13.5px}.app{height:auto;min-height:100dvh;padding:6px;display:block}.brand{margin-bottom:5px}.opening{margin-bottom:6px}.opening-grid{grid-template-columns:1fr;gap:3px}.main-tabs{margin-bottom:6px}.workspace{display:block}.panel{display:none;height:auto;grid-template-rows:auto auto;overflow:visible;margin-bottom:6px}.panel.active{display:grid}.panel-body{overflow:visible;padding:0 4px 5px}.qa-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.qa-group{min-width:0;max-width:100%;padding:5px}.qa-group-title{font-size:13px;margin-bottom:3px;overflow-wrap:anywhere}.qa-group .index-list{gap:3px}.qa-group .index-item{grid-template-columns:minmax(0,1fr) 52px;column-gap:4px;min-width:0;min-height:34px;padding:2px}.qa-group .index-name{min-width:0;padding:2px;font-size:12px;line-height:1.2;overflow-wrap:anywhere}.qa-group .copy{width:52px;min-width:52px;min-height:34px;padding:2px 4px;font-size:13px;white-space:nowrap}.drawer{top:auto;bottom:0;width:100%;height:min(72dvh,620px);border-radius:14px 14px 0 0;padding:12px}.drawer-title{font-size:15px}.drawer-text{font-size:14.5px}}
  </style>
</head>
<body>
  <main class="app">
    <h1 class="brand">销售话术卡</h1>
    <section class="opening">
      <h2 class="section-label">① 新客进线</h2>
      <div class="opening-grid" id="opening"></div>
    </section>
    <nav class="main-tabs" aria-label="话术区域切换">
      <button class="main-tab active" data-pane="customers" type="button" aria-selected="true">客户分类</button>
      <button class="main-tab" data-pane="qa" type="button" aria-selected="false">高频Q&A</button>
    </nav>
    <div class="workspace">
      <section class="panel customer-panel active" id="customers-panel">
        <h2 class="panel-title">② 客户分类</h2>
        <div class="panel-body"><div class="customer-groups" id="customer-groups"></div></div>
      </section>
      <section class="panel qa-panel" id="qa-panel">
        <h2 class="panel-title">③ 高频Q&A</h2>
        <div class="panel-body"><div class="qa-grid" id="qa-grid"></div></div>
      </section>
    </div>
  </main>
  <div class="drawer-layer" id="drawer-layer" aria-hidden="true">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-head"><h2 class="drawer-title" id="drawer-title"></h2><button class="close" id="drawer-close" type="button" aria-label="关闭">×</button></header>
      <div class="drawer-text" id="drawer-text"></div>
      <button class="drawer-copy" id="drawer-copy" type="button">复制完整话术</button>
    </aside>
  </div>

    const byId=id=>document.getElementById(id);
    let currentText='';
    async function copyText(text,button,row){
      try{
        await navigator.clipboard.writeText(text);
        const original=button.textContent;button.textContent='已复制 ✓';if(row)row.classList.add('flash');
        setTimeout(()=>{button.textContent=original;if(row)row.classList.remove('flash')},1000);
      }catch(error){window.prompt('请手动复制',text)}
    }
    function openDrawer(name,text){currentText=text;byId('drawer-title').textContent=name;byId('drawer-text').textContent=text;byId('drawer-layer').classList.add('open');byId('drawer-layer').setAttribute('aria-hidden','false')}
    function closeDrawer(){byId('drawer-layer').classList.remove('open');byId('drawer-layer').setAttribute('aria-hidden','true')}
    function indexItem(name,text){
      const row=document.createElement('div');row.className='index-item';
      const title=document.createElement('button');title.type='button';title.className='index-name';title.textContent=name;title.addEventListener('click',()=>openDrawer(name,text));
      const copy=document.createElement('button');copy.type='button';copy.className='copy';copy.textContent='复制';copy.addEventListener('click',()=>copyText(text,copy,row));
      row.append(title,copy);return row;
    }
    function renderList(target,names,lines){target.replaceChildren(...lines.map((line,index)=>indexItem(names[index],line)))}
    function renderCustomerGroups(){
      byId('customer-groups').replaceChildren(...data.content.customers.map(group=>{
        const section=document.createElement('section');section.className='customer-group';
        const title=document.createElement('h3');title.className='customer-group-title';title.textContent=group.title.replace(/^[ABC]\.\s*/, '');
        const list=document.createElement('div');list.className='index-list';
        renderList(list,data.labels.customers[group.title],group.lines);section.append(title,list);return section;
      }));
    }
    function renderQaGroups(){
      byId('qa-grid').replaceChildren(...data.content.qa.map(group=>{
        const section=document.createElement('section');section.className='qa-group';
        const title=document.createElement('h3');title.className='qa-group-title';title.textContent=group.title;
        const list=document.createElement('div');list.className='index-list';
        renderList(list,data.labels.qa[group.title],group.lines);section.append(title,list);return section;
      }));
    }
    data.content.opening.forEach((line,index)=>byId('opening').append(indexItem(data.labels.opening[index],line)));
    renderCustomerGroups();
    renderQaGroups();
    document.querySelectorAll('.main-tab').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('.main-tab').forEach(tab=>{const selected=tab===button;tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected))});
      byId('customers-panel').classList.toggle('active',button.dataset.pane==='customers');
      byId('qa-panel').classList.toggle('active',button.dataset.pane==='qa');
    }));
    byId('drawer-close').addEventListener('click',closeDrawer);
    byId('drawer-layer').addEventListener('click',event=>{if(event.target===byId('drawer-layer'))closeDrawer()});
    byId('drawer-copy').addEventListener('click',()=>copyText(currentText,byId('drawer-copy')));
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
  </script>
</body>
</html>
