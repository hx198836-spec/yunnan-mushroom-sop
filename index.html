    const byId=id=>document.getElementById(id);let currentText='';
    async function copyText(text,button,row){let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch(error){const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();copied=document.execCommand('copy');area.remove()}if(copied){const original=button.textContent;button.textContent='已复制✓';if(row)row.classList.add('flash');setTimeout(()=>{button.textContent=original;if(row)row.classList.remove('flash')},1000)}}
    function openDrawer(name,text){currentText=text;byId('drawer-title').textContent=name;byId('drawer-text').textContent=text;byId('drawer-layer').classList.add('open');byId('drawer-layer').setAttribute('aria-hidden','false')}
    function closeDrawer(){byId('drawer-layer').classList.remove('open');byId('drawer-layer').setAttribute('aria-hidden','true')}
    function scriptRow(name,text){const row=document.createElement('div');row.className='script-row';const title=document.createElement('button');title.type='button';title.className='script-name';title.textContent=name;title.addEventListener('click',()=>openDrawer(name,text));const copy=document.createElement('button');copy.type='button';copy.className='copy';copy.textContent='复制';copy.addEventListener('click',()=>copyText(text,copy,row));row.append(title,copy);return row}
    function renderList(target,names,lines){target.replaceChildren(...lines.map((line,index)=>scriptRow(names[index],line)))}
    function renderGroups(target,groups,labelMap){target.replaceChildren(...groups.map(group=>{const section=document.createElement('section');section.className='group-card';const title=document.createElement('h3');title.className='group-title';title.textContent=group.title.replace(/^[A-D]\.\s*/, '');const list=document.createElement('div');list.className='index-list';renderList(list,labelMap[group.title],group.lines);section.append(title,list);return section}))}
    data.content.opening.forEach((line,index)=>byId('opening').append(scriptRow(data.labels.opening[index],line)));
    renderGroups(byId('customer-grid'),data.content.customers,data.labels.customers);renderGroups(byId('qa-grid'),data.content.qa,data.labels.qa);
    document.querySelectorAll('.main-tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.main-tab').forEach(tab=>{const selected=tab===button;tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected))});byId('customers-panel').classList.toggle('active',button.dataset.pane==='customers');byId('qa-panel').classList.toggle('active',button.dataset.pane==='qa')}));
    byId('drawer-close').addEventListener('click',closeDrawer);byId('drawer-layer').addEventListener('click',event=>{if(event.target===byId('drawer-layer'))closeDrawer()});byId('drawer-copy').addEventListener('click',()=>copyText(currentText,byId('drawer-copy')));document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
